  async function updateCategory(id, changes) {
    if (!useLocal) {
      const result = await apiPost(`/categories/${id}`, 'POST', changes);
      if (result.ok) return result.data;
      if (!result.networkFailure) return result; // real validation error (e.g. cycle) — don't fall back
    }
    const category = localCategories.find((c) => c.id === id);
    if (category) {
      if (changes.name !== undefined) category.name = changes.name;
      if (changes.parent_id !== undefined) category.parent_id = changes.parent_id ? Number(changes.parent_id) : null;
      if (changes.todoist_project_id !== undefined) category.todoist_project_id = changes.todoist_project_id || null;
      if (changes.exam_date !== undefined) category.exam_date = changes.exam_date || null;
      saveLocalCategories();
      reclampLocalTopics();
    }
    return category;
  }

  // Mirrors the server's safe-archive guard (worker/index.js DELETE
  // /api/categories/:id) for the localStorage fallback mode — this app is
  // explicitly designed to run standalone, so the guard needs a copy here
  // too, not just server-side. Returns { ok: true } or { ok: false, error }.
  async function archiveCategory(id) {
    if (!useLocal) {
      const result = await apiPost(`/categories/${id}`, 'DELETE');
      if (result.ok) return { ok: true };
      if (!result.networkFailure) return result;
    }
    const childCount = localCategories.filter((c) => c.parent_id === id && !c.archived).length;
    const topicCount = localTopics.filter((t) => t.category_id === id && !t.archived).length;
    if (childCount > 0 || topicCount > 0) {
      const reasons = [];
      if (childCount > 0) reasons.push(`${childCount} active subcategor${childCount === 1 ? 'y' : 'ies'}`);
      if (topicCount > 0) reasons.push(`${topicCount} active topic${topicCount === 1 ? '' : 's'}`);
      return { ok: false, error: `Cannot archive: ${reasons.join(' and ')} still reference this category. Reassign or archive them first.` };
    }
    const category = localCategories.find((c) => c.id === id);
    if (category) { category.archived = 1; saveLocalCategories(); }
    return { ok: true };
  }

  // Local-mode undo support: a one-slot snapshot of a topic's pre-review
  // state, transient/in-memory only (matches the undo toast's own 5-6s
  // lifetime — nothing here needs to survive a reload).
  let lastLocalUndoSnapshot = null; // { topicId, ef, interval_days, repetitions, next_due, last_reviewed, last_quality }

  async function reviewTopic(id, quality, minutesSpent) {
    if (!useLocal) {
      try { return await apiFetch(`/topics/${id}/review`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quality, minutes_spent: minutesSpent ?? undefined }),
      }); } catch (e) { /* fall through */ }
    }
    const topic = localTopics.find((t) => t.id === id);
    lastLocalUndoSnapshot = {
      topicId: id, ef: topic.ef, interval_days: topic.interval_days,
      repetitions: topic.repetitions, next_due: topic.next_due, last_reviewed: topic.last_reviewed,
      last_quality: topic.last_quality ?? null,
    };
    const elapsedDays = topic.last_reviewed
      ? Math.round((Date.parse(todayISO()) - Date.parse(topic.last_reviewed)) / 86400000)
      : 0;
    const after = sm2(topic, quality, elapsedDays);
    if (topic.category_id) {
      const categoryMap = Object.fromEntries(localCategories.map((c) => [c.id, c]));
      const cap = examCapDate(examDatesFor(categoryMap, topic.category_id), todayISO(), todayISO());
      if (cap && after.next_due > cap) after.next_due = cap;
    }
    Object.assign(topic, after);
    topic.last_reviewed = todayISO();
    topic.last_quality = quality;
    topic.reviewLog = topic.reviewLog || [];
    topic.reviewLog.push(todayISO());
    saveLocal();
    return topic;
  }

  async function undoReview(id) {
    if (!useLocal) {
      const result = await apiPost(`/topics/${id}/undo-review`, 'POST');
      return result.ok;
    }
    if (!lastLocalUndoSnapshot || lastLocalUndoSnapshot.topicId !== id) return false;
    const topic = localTopics.find((t) => t.id === id);
    if (!topic) return false;
    const { ef, interval_days, repetitions, next_due, last_reviewed, last_quality } = lastLocalUndoSnapshot;
    Object.assign(topic, { ef, interval_days, repetitions, next_due, last_reviewed, last_quality });
    topic.reviewLog.pop(); // otherwise the heatmap would still count the undone review
    lastLocalUndoSnapshot = null;
    saveLocal();
    return true;
  }

  // Single global toast slot, not per-topic: a new review always replaces
  // any pending undo rather than letting two coexist, which is also what
  // keeps the backend's "undo whichever review is currently latest" safe
  // without needing a client-supplied review id.
  let undoToastTimer = null;
  function showUndoToast(id, quality, nextDue) {
    clearTimeout(undoToastTimer);
    const toast = document.getElementById('undoToast');
    let message = `Rated ${quality}.`;
    if (nextDue) {
      const days = daysBetween(todayISO(), nextDue);
      const when = days <= 0 ? 'later today' : days === 1 ? 'tomorrow' : `in ${days} days`;
      message = quality < 3
        ? `No worries — you'll see it again ${when}.`
        : `Nice. Next look ${when}.`;
    }
    toast.innerHTML = `${escapeHtml(message)} <button type="button" id="undoBtn">Undo</button>`;
    showFloating(toast);
    document.getElementById('undoBtn').onclick = async () => {
      hideFloating(toast);
      const ok = await undoReview(id);
      if (ok) refresh();
    };
    undoToastTimer = setTimeout(() => hideFloating(toast), 6000);
  }

  // Quality is picked first (by click or keyboard), then this prompt asks
  // how long the revision took before the review actually gets recorded -
  // skippable, since not every review is worth timing.
  let pendingReview = null; // { topicId, quality }

  function showTimePrompt(topicId, quality) {
    pendingReview = { topicId, quality };
    // Keep the chosen rating visibly selected while the time prompt is up,
    // so the tap clearly "took".
    document.querySelectorAll('.qbtn.picked').forEach((b) => b.classList.remove('picked'));
    document.querySelectorAll(`.qbtn[data-id="${topicId}"][data-q="${quality}"]`).forEach((b) => b.classList.add('picked'));
    hideFloating(document.getElementById('undoToast'));
    document.getElementById('timeHours').value = '';
    document.getElementById('timeMins').value = '';
    showFloating(document.getElementById('timePrompt'));
    document.getElementById('timeHours').focus();
  }

  async function finishPendingReview(minutesSpent) {
    if (!pendingReview) return;
    const { topicId, quality } = pendingReview;
    pendingReview = null;
    hideFloating(document.getElementById('timePrompt'));
    // Acknowledge instantly; the row settles into its new place once the
    // new schedule comes back.
    document.querySelector(`.topic[data-id="${topicId}"]`)?.classList.add('is-settling');
    const reviewed = await reviewTopic(topicId, quality, minutesSpent).catch(() => null);
    showUndoToast(topicId, quality, reviewed && reviewed.next_due);
    await refresh();
    flashRow(topicId);
  }

  document.getElementById('timeLogBtn').addEventListener('click', () => {
    const h = Number(document.getElementById('timeHours').value) || 0;
    const m = Number(document.getElementById('timeMins').value) || 0;
    finishPendingReview(h * 60 + m);
  });
  document.getElementById('timeSkipBtn').addEventListener('click', () => finishPendingReview(null));
  document.getElementById('timePrompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('timeLogBtn').click();
  });

  function renderHeatmap(days) {
    patchChildren(document.getElementById('heatmap'), days
      .map((d) => {
        const tier = d.count === 0 ? 0 : d.count <= 1 ? 1 : d.count <= 3 ? 2 : 3;
        const cls = tier > 0 ? `heat-cell heat-${tier}` : 'heat-cell';
        return `<div class="${cls}" title="${d.day}: ${d.count} review${d.count === 1 ? '' : 's'}"></div>`;
      })
      .join(''));
  }

  let lastTopics = [];
  let lastCategories = [];
  let confirmingArchiveId = null;
  let editingTopicId = null;

  /**
   * Edit mode covers exactly the fields a topic is actually created with —
   * title, category, Todoist project override — not scheduling state
   * (next_due/EF/repetitions), which isn't something the user "inputs".
   * Hidden entirely offline (useLocal) since there's nothing live to
   * resolve a project override against; category options still show since
   * those are Steady's own data, not Todoist's.
   */
  function renderTopicEditForm(t) {
    const categoryOptions = '<option value="">Uncategorized</option>' + categoryOptionsHtml(lastCategories, t.category_id);
    const showProjectPicker = !useLocal && todoistProjects && todoistProjects.length;
    const projectOptions = showProjectPicker
      ? '<option value="">No override (use category/default)</option>' + projectOptionsHtml(todoistProjects, t.todoist_project_id)
      : null;
    return `
      <div class="topic-edit-form" data-topic-edit-form="${t.id}">
        <input type="text" class="topic-edit-title" value="${escapeHtml(t.title)}" />
        <div class="topic-edit-row">
          <select class="project-picker topic-edit-category">${categoryOptions}</select>
          ${projectOptions !== null ? `<select class="project-picker topic-edit-project">${projectOptions}</select>` : ''}
        </div>
        <div class="topic-edit-actions" data-topic-edit-actions="${t.id}">
          <button type="button" class="ghost" data-save-topic="${t.id}">Save</button>
          <button type="button" class="ghost" data-cancel-edit-topic="${t.id}">Cancel</button>
        </div>
      </div>`;
  }

  function dueTitle(nextDue, today) {
    const d = daysBetween(today, nextDue);
    if (d === 0) return 'Due today';
    if (d < 0) return `${-d} day${d === -1 ? '' : 's'} overdue`;
    return `Due in ${d} day${d === 1 ? '' : 's'} (${formatShortDate(nextDue)})`;
  }

  function renderTopicRow(t, today) {
    const overdue = t.next_due < today;
    const isToday = t.next_due === today;
    const dueLabel = isToday ? 'today' : dueDelta(t.next_due, today);
    const dueClass = overdue ? 'overdue' : isToday ? 'due-today' : '';
    const statusClass = overdue ? 'status-overdue' : isToday ? 'status-today' : '';
    const projectName = t.todoist_project_id ? projectsById[t.todoist_project_id] : null;
    const metaBits = [];
    if (!t.last_reviewed) metaBits.push('Not reviewed yet');
    else {
      const ago = daysBetween(t.last_reviewed, today);
      metaBits.push(ago <= 0 ? 'Reviewed today' : ago === 1 ? 'Reviewed yesterday' : `Last reviewed ${ago} days ago`);
      // The ease factor, in words. Only once there's a review behind it -
      // every new topic starts at 2.5, which says nothing yet.
      metaBits.push(t.ef >= 2.5 ? 'comes easily' : t.ef >= 2.0 ? 'takes some work' : 'a tough one');
    }
    if (t.total_minutes_spent) metaBits.push(`${formatMinutes(t.total_minutes_spent)} spent so far`);
    if (projectName) metaBits.push(`→ ${escapeHtml(projectName)}`);
    const archiveControl = confirmingArchiveId === t.id
      ? `<div class="archive-confirm-row">
           <button type="button" class="archive-confirm" data-confirm-archive="${t.id}">Archive it?</button>
           <button type="button" class="archive-cancel" data-cancel-archive="${t.id}">Cancel</button>
         </div>`
      : `<button type="button" class="archive-btn" data-archive="${t.id}" title="Archive this topic">&times;</button>`;
    const isEditing = editingTopicId === t.id;
    const displayBlock = `
      <div class="topic-title">${escapeHtml(t.title)}</div>
      <div class="topic-meta" title="Ease factor ${t.ef.toFixed(2)} · current streak ${t.repetitions}">${metaBits.join(' · ')}</div>
      ${renderRetention(t, today)}
      ${t.trajectory_note ? `<div class="topic-insight">${escapeHtml(t.trajectory_note)}</div>` : ''}
      ${renderReviewHistory(t)}
      ${t.unconfirmed_completion_at ? `<div class="topic-insight topic-unconfirmed">You ticked this off in Todoist without a 0–5 rating, so it's back on your list.</div>` : ''}
      <div class="quality-row" id="qrow-${t.id}">
        <div class="qbtns"><div class="q-hint">How well did it come back? 0 is blank, 5 is effortless.</div>${[0, 1, 2, 3, 4, 5].map((q) => `<button class="qbtn" data-q="${q}" data-id="${t.id}" title="${QUALITY_LABELS[q]}">${q}</button>`).join('')}</div>
      </div>`;
    return `
      <div class="topic ${statusClass}" data-id="${t.id}" data-flip="t${t.id}">
        <div style="flex:1">
          ${isEditing ? renderTopicEditForm(t) : displayBlock}
        </div>
        <div class="topic-right">
          ${t.todoist_task_id ? '<div class="pushed-dot" title="Waiting in your Todoist"></div>' : ''}
          <div class="topic-due ${dueClass}" data-toggle="${t.id}" style="cursor:pointer" title="${dueTitle(t.next_due, today)} — tap to rate">${dueLabel}</div>
          ${!isEditing ? `<button type="button" class="topic-edit-btn" data-edit-topic="${t.id}" title="Edit">Edit</button>` : ''}
          ${!isEditing ? archiveControl : ''}
        </div>
      </div>`;
  }

  function renderTopics(topics, categories) {
    lastTopics = topics;
    if (categories) lastCategories = categories;
    const list = document.getElementById('topicList');
    if (!topics.length) {
      patchChildren(list, '<div class="empty">Nothing here yet. Add something you studied today, and Steady will take it from there.</div>');
      return;
    }
    const today = todayISO();

    // No category ever created: exact flat list, zero visible change from
    // before this feature existed — no stray "Uncategorized" header either.
    if (!lastCategories.length) {
      flipPatch(list, topics.map((t) => renderTopicRow(t, today)).join(''));
      return;
    }

    const { byId, order } = buildCategoryTree(lastCategories);
    const byCategoryId = {};
    const uncategorized = [];
    for (const t of topics) {
      if (t.category_id && byId[t.category_id]) (byCategoryId[t.category_id] ||= []).push(t);
      else uncategorized.push(t);
    }

    // Ancestors of any category holding topics also get a header, even with
    // zero topics directly in them (pure "folder" categories).
    const idsToRender = new Set();
    for (const catId of Object.keys(byCategoryId)) {
      let cur = byId[catId];
      while (cur) {
        idsToRender.add(cur.id);
        cur = cur.parent_id ? byId[cur.parent_id] : null;
      }
    }

    let html = '';
    if (uncategorized.length) {
      html += `<div class="cat-header" data-flip="uncategorized">Uncategorized</div>`;
      html += uncategorized.map((t) => renderTopicRow(t, today)).join('');
    }
    for (const { id, category, depth } of order) {
      if (!idsToRender.has(id)) continue;
      html += `<div class="cat-header" data-flip="c${id}" style="padding-left:${depth * 16}px"><span>${escapeHtml(category.name)}</span>${examChipHtml(category)}</div>`;
      html += (byCategoryId[id] || []).map((t) => renderTopicRow(t, today)).join('');
    }
    flipPatch(list, html);
  }

  // --- Rendering without snapping -----------------------------------------
  //
  // Every render here builds a full HTML string (simple, no framework), but
  // assigning it via innerHTML throws away every node and rebuilds them -
  // the page visibly "re-prints" after each action, restarts animations, and
  // nothing can transition because nothing survives. patchChildren() instead
  // keeps any existing child whose markup is unchanged, in place and
  // untouched, and only swaps in what actually differs. flipPatch() adds
  // FLIP on top (First, Last, Invert, Play): it records where each keyed
  // element ([data-flip]) was, patches, then animates it from its old spot to
  // its new one - so a just-rated topic glides down the list to where its
  // new due date puts it, and everything below slides up to fill the gap.

  const MOTION = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';

  function patchChildren(container, html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();
    const reusable = new Map(); // outerHTML -> [live nodes with that exact markup]
    for (const el of container.children) {
      if (!reusable.has(el.outerHTML)) reusable.set(el.outerHTML, []);
      reusable.get(el.outerHTML).push(el);
    }
    const desired = [...tpl.content.children].map((el) => reusable.get(el.outerHTML)?.shift() || el);
    desired.forEach((el, i) => {
      if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null);
    });
    while (container.children.length > desired.length) container.lastElementChild.remove();
    // Stray whitespace text nodes left over from any earlier innerHTML render.
    for (const n of [...container.childNodes]) if (n.nodeType === 3) n.remove();
  }

  const hasRenderedOnce = new WeakSet();
  function flipPatch(container, html) {
    const before = new Map();
    if (MOTION) for (const el of container.querySelectorAll('[data-flip]')) before.set(el.dataset.flip, el.getBoundingClientRect().top);
    patchChildren(container, html);
    if (!MOTION) return;
    const firstRender = !hasRenderedOnce.has(container);
    hasRenderedOnce.add(container);
    let entering = 0;
    for (const el of container.querySelectorAll('[data-flip]')) {
      const top = before.get(el.dataset.flip);
      if (top === undefined) {
        // New element: fade up into place - staggered on the very first
        // render so the list reads as arriving, not printing.
        const delay = firstRender ? Math.min(entering++ * 28, 320) : 0;
        el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
          { duration: 360, delay, easing: EASE, fill: 'backwards' });
        continue;
      }
      const dy = top - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) {
        el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }],
          { duration: Math.min(700, 380 + Math.abs(dy) * 0.15), easing: EASE });
      }
    }
  }

  function flashRow(id) {
    const row = document.querySelector(`.topic[data-id="${id}"]`);
    if (!row || !MOTION) return;
    row.animate(
      [{ boxShadow: '0 0 0 1px #f0b429, 0 0 26px rgba(240,180,41,0.45)' }, { boxShadow: '0 0 0 1px rgba(240,180,41,0), 0 0 26px rgba(240,180,41,0)' }],
      { duration: 1100, easing: 'ease-out' }
    );
  }

  // Animate an element out before whatever removes it runs.
  async function animateOut(el) {
    if (!el || !MOTION) return;
    await el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(16px)' }],
      { duration: 200, easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {});
  }

  function showFloating(el) {
    clearTimeout(el._hideTimer);
    el.classList.remove('leaving');
    el.style.display = '';
  }
  function hideFloating(el) {
    if (el.style.display === 'none') return;
    if (!MOTION) { el.style.display = 'none'; return; }
    el.classList.add('leaving');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => { el.style.display = 'none'; el.classList.remove('leaving'); }, 180);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --- Per-topic review history (time spent + confidence per past review) -

  function formatReviewDate(reviewedAt) {
    // reviewed_at is SQLite's raw "YYYY-MM-DD HH:MM:SS" UTC (space, no zone) —
    // same shape /api/sync-status already normalizes before parsing.
    const d = new Date(reviewedAt.replace(' ', 'T') + 'Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function qualityDotClass(q) {
    return q <= 1 ? 'q-low' : q <= 3 ? 'q-mid' : 'q-high';
  }
  function formatMinutes(total) {
    const h = Math.floor(total / 60), m = total % 60;
    return h && m ? `${h}h ${m}m` : h ? `${h}h` : `${m}m`;
  }
  function renderReviewHistory(t) {
    if (!t.recent_reviews || !t.recent_reviews.length) return '';
    const dots = t.recent_reviews.map((r) => {
      const mins = r.minutes_spent != null ? ` · ${formatMinutes(r.minutes_spent)}` : '';
      const title = `${formatReviewDate(r.reviewed_at)} · Q${r.quality}${mins}`;
      return `<div class="review-dot ${qualityDotClass(r.quality)}" title="${escapeHtml(title)}"></div>`;
    }).join('');
    return `<div class="review-history">${dots}</div>`;
  }

  // --- Category manager UI -------------------------------------------------

  let todoistProjects = null; // cached from loadTodoistProjects(), shared by the topic and category pickers
  let editingCategoryId = null;
  let confirmingCategoryArchiveId = null;
  let categoryError = null;

  function renderCategoryPickers(categories) {
    const { order } = buildCategoryTree(categories);
    const options = order
      .map(({ category, depth }) => `<option value="${category.id}">${'  '.repeat(depth)}${escapeHtml(category.name)}</option>`)
      .join('');

    const topicPicker = document.getElementById('categoryPicker');
    const selectedTopic = topicPicker.value;
    topicPicker.innerHTML = '<option value="">Uncategorized</option>' + options;
    topicPicker.value = selectedTopic;

    const parentPicker = document.getElementById('categoryParentPicker');
    const selectedParent = parentPicker.value;
    parentPicker.innerHTML = '<option value="">Top level</option>' + options;
    parentPicker.value = selectedParent;

    const bulkPicker = document.getElementById('bulkCategoryPicker');
    const selectedBulk = bulkPicker.value;
    bulkPicker.innerHTML = '<option value="">Uncategorized</option>' + options;
    bulkPicker.value = selectedBulk;
  }

  function renderCategoryList(categories) {
    const list = document.getElementById('categoryManagerList');
    const errorHtml = categoryError
      ? `<div class="topic-due overdue" style="display:inline-block;margin-bottom:10px">${escapeHtml(categoryError)}</div>`
      : '';
    if (!categories.length) {
      patchChildren(list, errorHtml + '<div class="empty">No categories yet. Make one per course or subject.</div>');
      return;
    }
    const { order } = buildCategoryTree(categories);
    patchChildren(list, errorHtml + order.map(({ id, category, depth }) => {
      const indent = depth * 16;
      if (editingCategoryId === id) {
        const parentOptions = order
          .filter((o) => o.id !== id)
          .map((o) => `<option value="${o.category.id}" ${o.category.id === category.parent_id ? 'selected' : ''}>${'  '.repeat(o.depth)}${escapeHtml(o.category.name)}</option>`)
          .join('');
        const projectOptions = todoistProjects
          ? projectOptionsHtml(todoistProjects, category.todoist_project_id)
          : '';
        return `
          <div class="cat-edit-row" style="padding-left:${indent}px">
            <input type="text" class="cat-edit-name" value="${escapeHtml(category.name)}" />
            <select class="project-picker cat-edit-parent"><option value="">Top level</option>${parentOptions}</select>
            ${todoistProjects ? `<select class="project-picker cat-edit-project"><option value="">No override</option>${projectOptions}</select>` : ''}
            <label class="cat-exam-label">Exam <input type="date" class="cat-edit-exam" value="${category.exam_date || ''}" /></label>
            <button type="button" class="ghost" data-save-cat="${id}">Save</button>
            <button type="button" class="ghost" data-cancel-edit-cat="${id}">Cancel</button>
          </div>`;
      }
      if (confirmingCategoryArchiveId === id) {
        return `
          <div class="cat-row" style="padding-left:${indent}px">
            <span>${escapeHtml(category.name)}</span>
            <div class="archive-confirm-row">
              <button type="button" class="archive-confirm" data-confirm-cat-archive="${id}">Archive it?</button>
              <button type="button" class="archive-cancel" data-cancel-cat-archive="${id}">Cancel</button>
            </div>
          </div>`;
      }
      const projectName = category.todoist_project_id ? (projectsById[category.todoist_project_id] || category.todoist_project_id) : null;
      return `
        <div class="cat-row" style="padding-left:${indent}px">
          <span class="cat-name" data-edit-cat="${id}">${escapeHtml(category.name)}${projectName ? ` <span style="color:var(--text-dim);font-size:12px">→ ${escapeHtml(projectName)}</span>` : ''}</span>
          <div class="cat-row-right">
            ${examChipHtml(category)}
            <button type="button" class="archive-btn" data-archive-cat="${id}" title="Archive">&times;</button>
          </div>
        </div>`;
    }).join(''));
  }

  function renderCategoryManager(categories) {
    lastCategories = categories;
    renderCategoryPickers(categories);
    renderCategoryList(categories);
  }

  // Everything is fetched in parallel and rendered in one pass, so the page
  // updates as a whole instead of panel by panel.
  let hasLoaded = false;
  // The line under the wordmark: a greeting for the time of day (IST, like
  // everything else) and how much is waiting today, in plain words.
  function renderGreeting(topics) {
    const el = document.getElementById('greeting');
    if (!topics.length) {
      el.textContent = 'Log what you studied. Steady tells you when to look at it again.';
      return;
    }
    const hour = nowIST().getUTCHours();
    const hello = hour < 5 ? 'Up late' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    const today = todayISO();
    const dueToday = topics.filter((t) => t.next_due === today).length;
    const overdue = topics.filter((t) => t.next_due < today).length;
    let load;
    if (!dueToday && !overdue) load = "nothing's due today. Enjoy the quiet.";
    else if (!overdue) load = `${dueToday === 1 ? 'one topic is' : `${dueToday} topics are`} waiting for you today.`;
    else if (!dueToday) load = `${overdue === 1 ? 'one topic has' : `${overdue} topics have`} been waiting a while — no pressure, one at a time.`;
    else load = `${dueToday} due today, plus ${overdue} still waiting from earlier.`;
    el.textContent = `${hello} — ${load}`;
  }

  async function refresh() {
    const [topics, stats, categories, calendar] = await Promise.all([
      loadTopics(), loadStats(), loadCategories(), loadCalendar(calMonth),
    ]);
    hasLoaded = true;
    renderGreeting(topics);
    renderTopics(topics, categories);
    renderHeatmap(stats);
    renderCategoryManager(categories);
    renderReadiness(topics, categories);
    renderBulkPreview();
    calDays = calendar.days || {};
    renderCalendar(calendar);
    renderCalDetail();
  }

  document.getElementById('dailyQuote').textContent = dailyQuote();
  // Draw the heatmap and calendar empty right away, at their final size, so
  // nothing below them jumps when the real data lands a moment later.
  renderHeatmap(Array.from({ length: 28 }, (_, i) => ({ day: shiftISO(todayISO(), i - 27), count: 0 })));
  renderCalendar({ month: calMonth, days: {} });
  loadSyncStatus().then(renderSyncStatus);
  document.getElementById('pushNowBtn').addEventListener('click', pushNow);
  document.getElementById('syncNowBtn').addEventListener('click', syncNow);
  document.getElementById('signOutBtn').addEventListener('click', signOut);

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('titleInput');
    const title = input.value.trim();
    if (!title) return;
    const picker = document.getElementById('projectPicker');
    const categoryPicker = document.getElementById('categoryPicker');
    const studiedOnInput = document.getElementById('studiedOnInput');
    const studiedOn = studiedOnInput.style.display !== 'none' ? studiedOnInput.value : undefined;
    await addTopic(title, picker.style.display !== 'none' ? picker.value : undefined, categoryPicker.value, studiedOn);
    input.value = '';
    studiedOnInput.style.display = 'none';
    studiedOnInput.value = '';
    refresh();
  });

  // Collapsed by default — most adds are "today", so this stays out of the
  // way until asked for, same restraint used elsewhere in this app.
  document.getElementById('backdateToggle').addEventListener('click', () => {
    const dateInput = document.getElementById('studiedOnInput');
    const opening = dateInput.style.display === 'none';
    if (opening) {
      const today = todayISO();
      dateInput.max = today;
      dateInput.value = today;
      dateInput.style.display = '';
      dateInput.focus();
    } else {
      dateInput.style.display = 'none';
      dateInput.value = '';
    }
  });

  (async () => {
    const projects = await loadTodoistProjects();
    if (!projects || !projects.length) return;
    todoistProjects = projects;
    projectsById = Object.fromEntries(projects.map((p) => [p.id, p.name]));
    const picker = document.getElementById('projectPicker');
    picker.innerHTML = projectOptionsHtml(projects);
    const { order } = buildProjectTree(projects);
    const defaultIdx = order.findIndex(({ project }) => project.name === 'Steady');
    if (defaultIdx >= 0) picker.selectedIndex = defaultIdx;
    picker.style.display = '';
    const bulkProjectPicker = document.getElementById('bulkProjectPicker');
    bulkProjectPicker.innerHTML = '<option value="">Project: category/default</option>' + projectOptionsHtml(projects);
    bulkProjectPicker.style.display = '';
    const categoryTodoistPicker = document.getElementById('categoryTodoistPicker');
    categoryTodoistPicker.innerHTML = '<option value="">No override</option>' + projectOptionsHtml(projects);
    categoryTodoistPicker.style.display = '';
    // Re-render from what's already loaded so project names appear, rather
    // than refetching everything. If the first load hasn't landed yet, it'll
    // pick the names up itself.
    if (hasLoaded) {
      renderTopics(lastTopics);
      renderCategoryList(lastCategories);
    }
  })();

  ['bulkTitles', 'bulkPerDay', 'bulkCategoryPicker'].forEach((id) => {
    document.getElementById(id).addEventListener('input', () => renderBulkPreview());
  });

  document.getElementById('bulkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { titles, dates, categoryId } = bulkPlan();
    if (!titles.length) return;
    const projectPicker = document.getElementById('bulkProjectPicker');
    const submit = document.getElementById('bulkSubmit');
    submit.disabled = true;
    try {
      const result = await bulkImport(
        titles.map((title, i) => ({ title, next_due: dates[i] })),
        categoryId,
        projectPicker.style.display !== 'none' ? projectPicker.value : undefined,
      );
      if (!result.ok) { renderBulkPreview(result.error, true); return; }
      document.getElementById('bulkTitles').value = '';
      await refresh();
      renderBulkPreview(`Added ${result.created} topic${result.created === 1 ? '' : 's'}. The first ones are up today.`);
    } finally {
      submit.disabled = false;
    }
  });

  document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('categoryNameInput');
    const name = nameInput.value.trim();
    if (!name) return;
    const parentPicker = document.getElementById('categoryParentPicker');
    const todoistPicker = document.getElementById('categoryTodoistPicker');
    await addCategory(name, parentPicker.value, todoistPicker.style.display !== 'none' ? todoistPicker.value : undefined);
    nameInput.value = '';
    refresh();
  });

  document.getElementById('categoryManagerList').addEventListener('click', async (e) => {
    // .closest() everywhere here, not e.target directly — several of these
    // targets (e.g. a category name with a "→ ProjectName" hint span
    // nested inside it) have child markup a click can land on instead of
    // the element carrying the data attribute.
    const editEl = e.target.closest('[data-edit-cat]');
    if (editEl) {
      editingCategoryId = Number(editEl.dataset.editCat);
      categoryError = null;
      renderCategoryList(lastCategories);
      return;
    }
    const cancelEditEl = e.target.closest('[data-cancel-edit-cat]');
    if (cancelEditEl) {
      editingCategoryId = null;
      renderCategoryList(lastCategories);
      return;
    }
    const saveEl = e.target.closest('[data-save-cat]');
    if (saveEl) {
      const id = Number(saveEl.dataset.saveCat);
      const row = saveEl.closest('.cat-edit-row');
      const name = row.querySelector('.cat-edit-name').value.trim();
      if (!name) return;
      const parentId = row.querySelector('.cat-edit-parent').value;
      const projectPicker = row.querySelector('.cat-edit-project');
      const todoistProjectId = projectPicker ? projectPicker.value : '';
      const examDate = row.querySelector('.cat-edit-exam').value;
      const result = await updateCategory(id, { name, parent_id: parentId || null, todoist_project_id: todoistProjectId || null, exam_date: examDate || null });
      if (result && result.error) {
        categoryError = result.error;
        renderCategoryList(lastCategories);
        return;
      }
      editingCategoryId = null;
      categoryError = null;
      refresh();
      return;
    }
    const archiveEl = e.target.closest('[data-archive-cat]');
    if (archiveEl) {
      confirmingCategoryArchiveId = Number(archiveEl.dataset.archiveCat);
      categoryError = null;
      renderCategoryList(lastCategories);
      return;
    }
    const cancelArchiveEl = e.target.closest('[data-cancel-cat-archive]');
    if (cancelArchiveEl) {
      confirmingCategoryArchiveId = null;
      renderCategoryList(lastCategories);
      return;
    }
    const confirmArchiveEl = e.target.closest('[data-confirm-cat-archive]');
    if (confirmArchiveEl) {
      const result = await archiveCategory(Number(confirmArchiveEl.dataset.confirmCatArchive));
      confirmingCategoryArchiveId = null;
      if (!result.ok) {
        categoryError = result.error;
        renderCategoryList(lastCategories);
        return;
      }
      categoryError = null;
      refresh();
    }
  });

  document.getElementById('calPrev').addEventListener('click', () => { calMonth = shiftMonth(calMonth, -1); selectedCalDay = null; refreshCalendar(-1); });
  document.getElementById('calNext').addEventListener('click', () => { calMonth = shiftMonth(calMonth, 1); selectedCalDay = null; refreshCalendar(1); });

  document.getElementById('calGrid').addEventListener('click', (e) => {
    const cell = e.target.closest('.cal-day[data-date]');
    if (!cell) return;
    const date = cell.dataset.date;
    selectedCalDay = selectedCalDay === date ? null : date;
    renderCalendar({ month: calMonth, days: calDays });
    renderCalDetail();
  });

  document.getElementById('calDetail').addEventListener('click', async (e) => {
    if (e.target.dataset.detailReview === undefined) return;
    const id = e.target.dataset.id;
    const q = Number(e.target.dataset.q);
    const topicId = useLocal ? Number(id) : id;
    showTimePrompt(topicId, q);
  });

  function rerenderExamChips() {
    renderTopics(lastTopics);
    renderCategoryList(lastCategories);
    renderReadiness(lastTopics, lastCategories);
  }

  document.addEventListener('click', async (e) => {
    const setEl = e.target.closest('[data-set-exam]');
    if (setEl) {
      editingExamCategoryId = Number(setEl.dataset.setExam);
      rerenderExamChips();
      // The same category can appear in both lists - focus the one clicked.
      const scope = setEl.closest('#topicList, #categoryManagerList, #readinessList') || document;
      scope.querySelector(`[data-exam-edit="${editingExamCategoryId}"] input`)?.focus();
      return;
    }
    const cancelEl = e.target.closest('[data-cancel-exam]');
    if (cancelEl) {
      editingExamCategoryId = null;
      rerenderExamChips();
      return;
    }
    const saveEl = e.target.closest('[data-save-exam], [data-clear-exam]');
    if (saveEl) {
      const id = Number(saveEl.dataset.saveExam ?? saveEl.dataset.clearExam);
      const examDate = saveEl.dataset.clearExam !== undefined
        ? null
        : saveEl.closest('[data-exam-edit]').querySelector('input').value || null;
      saveEl.disabled = true;
      const result = await updateCategory(id, { exam_date: examDate });
      if (result && result.error) { saveEl.disabled = false; return; }
      editingExamCategoryId = null;
      await refresh(); // the server re-clamps due dates, so topics may move
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!e.target.closest || !e.target.closest('[data-exam-edit]')) return;
    if (e.key === 'Enter') { e.preventDefault(); e.target.closest('[data-exam-edit]').querySelector('[data-save-exam]').click(); }
    if (e.key === 'Escape') { editingExamCategoryId = null; rerenderExamChips(); }
  });

  document.getElementById('topicList').addEventListener('click', async (e) => {
    const archiveId = e.target.dataset.archive;
    if (archiveId) {
      confirmingArchiveId = Number(archiveId);
      renderTopics(lastTopics);
      return;
    }
    const confirmId = e.target.dataset.confirmArchive;
    if (confirmId) {
      await Promise.all([
        animateOut(e.target.closest('.topic')),
        archiveTopic(useLocal ? Number(confirmId) : confirmId),
      ]);
      confirmingArchiveId = null;
      refresh();
      return;
    }
    const cancelId = e.target.dataset.cancelArchive;
    if (cancelId) {
      confirmingArchiveId = null;
      renderTopics(lastTopics);
      return;
    }
    const toggleId = e.target.dataset.toggle;
    if (toggleId) {
      const row = document.getElementById(`qrow-${toggleId}`);
      const opening = !row.classList.contains('open');
      // At most one quality-row open at a time — otherwise "the currently
      // open row" is ambiguous for the 0-5 keyboard shortcut below.
      document.querySelectorAll('.quality-row.open').forEach((r) => r.classList.remove('open'));
      if (opening) row.classList.add('open');
      return;
    }
    const editTopicEl = e.target.closest('[data-edit-topic]');
    if (editTopicEl) {
      editingTopicId = Number(editTopicEl.dataset.editTopic);
      renderTopics(lastTopics);
      return;
    }
    const cancelEditTopicEl = e.target.closest('[data-cancel-edit-topic]');
    if (cancelEditTopicEl) {
      editingTopicId = null;
      renderTopics(lastTopics);
      return;
    }
    // "Save" doesn't persist immediately — it swaps in a "Save changes?"
    // confirm step first (asked again before anything is written), via
    // direct DOM manipulation rather than a state-driven re-render, so the
    // still-open title input / selects keep whatever the user just typed
    // or picked instead of snapping back to their original values.
    const saveTopicEl = e.target.closest('[data-save-topic]');
    if (saveTopicEl) {
      const id = saveTopicEl.dataset.saveTopic;
      const actions = document.querySelector(`[data-topic-edit-actions="${id}"]`);
      actions.innerHTML = `
        <span style="color:var(--text-dim);font-size:12px">Save changes?</span>
        <button type="button" class="archive-confirm" data-confirm-save-topic="${id}">Save</button>
        <button type="button" class="archive-cancel" data-cancel-confirm-save-topic="${id}">Cancel</button>`;
      return;
    }
    const confirmSaveTopicEl = e.target.closest('[data-confirm-save-topic]');
    if (confirmSaveTopicEl) {
      const id = Number(confirmSaveTopicEl.dataset.confirmSaveTopic);
      const form = document.querySelector(`[data-topic-edit-form="${id}"]`);
      const title = form.querySelector('.topic-edit-title').value.trim();
      if (!title) return;
      const categoryId = form.querySelector('.topic-edit-category').value;
      const projectSelect = form.querySelector('.topic-edit-project');
      const result = await updateTopic(id, {
        title,
        category_id: categoryId || undefined,
        todoist_project_id: projectSelect ? projectSelect.value || undefined : undefined,
      });
      if (result && result.error) return; // real validation error — leave the form open to fix
      editingTopicId = null;
      refresh();
      return;
    }
    const cancelConfirmSaveTopicEl = e.target.closest('[data-cancel-confirm-save-topic]');
    if (cancelConfirmSaveTopicEl) {
      const id = cancelConfirmSaveTopicEl.dataset.cancelConfirmSaveTopic;
      const actions = document.querySelector(`[data-topic-edit-actions="${id}"]`);
      actions.innerHTML = `
        <button type="button" class="ghost" data-save-topic="${id}">Save</button>
        <button type="button" class="ghost" data-cancel-edit-topic="${id}">Cancel</button>`;
      return;
    }
    const q = e.target.dataset.q;
    const id = e.target.dataset.id;
    if (q !== undefined) {
      const topicId = useLocal ? Number(id) : id;
      showTimePrompt(topicId, Number(q));
    }
  });

  // Keyboard shortcuts: 0-5 rates whichever quality-row is currently open,
  // / focuses the add-topic input, left/right arrows move the calendar
  // month. Everything here only ever .click()s the exact same elements the
  // mouse already uses, so there's no duplicated review/navigation logic.
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);

    if (e.key === '/') {
      if (isTyping) return; // literal slash types normally, incl. inside the title input itself
      e.preventDefault();
      document.getElementById('titleInput').focus();
      return;
    }
    if (isTyping) return;

    if (e.key >= '0' && e.key <= '5') {
      const openRow = document.querySelector('.quality-row.open');
      if (!openRow) return;
      openRow.querySelector(`.qbtn[data-q="${e.key}"]`)?.click();
      return;
    }
    if (e.key === 'ArrowLeft') { document.getElementById('calPrev').click(); return; }
    if (e.key === 'ArrowRight') { document.getElementById('calNext').click(); return; }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  refresh();
</script>
</body>
</html>
