<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steady</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#f0b429" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #150f04;
    --panel: #20160a;
    --border: #41300f;
    --text: #f5ecd8;
    --text-dim: #a8935f;
    --accent: #f0b429;
    --accent-dim: #8a6a2a;
    --accent2: #c98a2e;
    --danger: #e8623f;
    /* One motion vocabulary for the whole app: things decelerate into
       place (ease-out-quint-ish), quickly - nothing linear, nothing slow. */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 14px) scale(0.98); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(240,180,41,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(201,138,46,0.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 40px;
    margin: 0 0 4px;
    display: inline-block;
    color: var(--text);
    text-shadow: 0 0 18px rgba(240,180,41,0.45), 0 0 40px rgba(240,180,41,0.15);
  }
  .wordmark-cursor {
    display: inline-block;
    width: 9px;
    height: 0.62em;
    margin-left: 5px;
    vertical-align: -0.06em;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(240,180,41,0.7);
    animation: cursor-blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .wordmark-cursor { animation: none; } }
  @keyframes cursor-blink { 50% { opacity: 0; } }
  .masthead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tagline { color: var(--text-dim); margin: 0 0 32px; font-size: 14px; }
  .scrawl {
    font-family: 'Caveat', cursive;
    color: var(--accent2);
    font-size: 19px;
    margin-top: 14px;
    transform: rotate(-2deg);
    display: block;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  /* Heatmap: 28 days of review activity, GitHub-style intensity grid */
  .heatmap { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
  .heat-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    background: #231708;
    border: 1px solid var(--border);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .heat-cell:hover { transform: scale(1.15); }
  .heat-cell.heat-1 { background: #2c2210; border-color: transparent; }
  .heat-cell.heat-2 { background: #a87a1e; border-color: transparent; }
  .heat-cell.heat-3 {
    background: var(--accent);
    border-color: transparent;
    box-shadow: 0 0 10px rgba(240,180,41,0.5);
  }
  .heatmap-label { color: var(--text-dim); font-size: 11px; margin-top: 10px; display: flex; justify-content: space-between; }
  .sync-status { color: var(--text-dim); font-size: 11px; margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 24px; /* reserved, so the line filling in doesn't shove the page down */ }
  .push-now-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .push-now-btn:hover { border-color: var(--accent-dim); color: var(--text); filter: none; transform: none; box-shadow: none; }
  .push-now-btn:disabled { opacity: 0.5; cursor: default; }
  .undo-toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--text);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 12px; z-index: 100;
    animation: toast-in 0.32s var(--ease);
  }
  .undo-toast.leaving, .time-prompt.leaving {
    opacity: 0; transform: translate(-50%, 10px);
    transition: opacity 0.18s ease-in, transform 0.18s ease-in;
  }
  .undo-toast button {
    background: none; border: none; color: var(--accent); font-weight: 600;
    padding: 0; font-size: 13px; cursor: pointer;
  }
  .undo-toast button:hover { filter: none; transform: none; box-shadow: none; text-decoration: underline; }
  .time-prompt {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--text);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 8px; z-index: 100;
    animation: toast-in 0.32s var(--ease);
  }
  .time-prompt input[type="number"] {
    width: 52px; background: rgba(0,0,0,0.25); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px;
  }
  .time-prompt button { padding: 6px 12px; font-size: 13px; }

  /* Calendar: forward-looking due dates */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    padding-bottom: 4px;
    background-image: linear-gradient(90deg, var(--accent), var(--accent2));
    background-size: 100% 2px;
    background-repeat: no-repeat;
    background-position: 0 100%;
  }
  .cal-nav {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 36px; height: 36px; border-radius: 6px; padding: 0;
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  .cal-nav:hover { border-color: var(--accent-dim); color: var(--text); }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7,1fr);
    text-align: center; color: var(--text-dim); font-size: 11px; margin-bottom: 6px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-day {
    aspect-ratio: 1.6;
    min-width: 0;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #1c1409;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    font-size: 11px;
    color: var(--text-dim);
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s, transform 0.15s;
  }
  .cal-day.empty { border-color: transparent; background: transparent; }
  .cal-day.today {
    border-color: var(--accent);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 0 0 3px rgba(240,180,41,0.14);
  }
  /* The pulse animates only the opacity of a pre-drawn ring, which the
     compositor can do on its own - animating box-shadow directly repaints
     the cell every frame, forever. */
  .cal-day.today::after {
    content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
    box-shadow: 0 0 0 5px rgba(240,180,41,0.28);
    animation: cal-pulse 2.4s ease-in-out infinite;
  }
  @keyframes cal-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .cal-day.due-1 { background: rgba(240,180,41,0.16); color: var(--text); }
  .cal-day.due-2 {
    background: rgba(240,180,41,0.32);
    color: var(--text); border-color: var(--accent-dim);
  }
  .cal-day.due-3 {
    background: var(--accent);
    color: #201400; font-weight: 600; border-color: var(--accent);
    box-shadow: 0 0 14px rgba(240,180,41,0.5);
  }
  .cal-day.overdue-1 { background: rgba(232,98,63,0.18); color: var(--text); }
  .cal-day.overdue-2 {
    background: rgba(232,98,63,0.38);
    color: var(--text); border-color: var(--danger);
  }
  .cal-day.overdue-3 {
    background: var(--danger);
    color: #210a04; font-weight: 600; border-color: var(--danger);
    box-shadow: 0 0 14px rgba(232,98,63,0.5);
  }
  .cal-day.has-due { cursor: pointer; }
  .cal-day.has-due:hover { transform: scale(1.07); box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
  .cal-day.has-due:active { transform: scale(0.97); transition-duration: 0.06s; }
  .cal-day.selected { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-badge {
    position: absolute; top: 3px; right: 3px; font-size: 9px; font-weight: 700;
    background: rgba(0,0,0,0.35); border-radius: 999px;
    min-width: 14px; height: 14px; padding: 0 3px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Calendar day-detail: appears below the grid when a due day is clicked */
  .cal-detail {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,0.12);
    animation: rise 0.28s var(--ease);
  }
  .cal-detail-topic { animation: rise 0.32s var(--ease) both; }
  .cal-detail-title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .cal-detail-topic {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 6px 0; padding: 8px 0;
  }
  .cal-detail-topic + .cal-detail-topic { border-top: 1px solid rgba(255,255,255,0.06); }
  .cal-detail-topic > span { min-width: 0; }
  .cal-detail-quality {
    display: flex; gap: 4px; flex-wrap: wrap;
    flex-basis: 100%; /* always its own line below the title, regardless
                          of how short the title is - otherwise a short
                          title leaves the buttons stranded far to the
                          right via justify-content: space-between while a
                          long title wraps them below, an inconsistent
                          look across rows in the same list. */
  }

  form.add-topic { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent-dim); }
  input[type="date"] {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    color-scheme: dark;
  }
  input[type="date"]:focus { outline: none; border-color: var(--accent-dim); }
  select.project-picker {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 160px;
  }
  select.project-picker:focus { outline: none; border-color: var(--accent-dim); }
  /* The closed <select> box picks up the theme via the rules above, but the
     native open-dropdown popup ignores inherited/background styling unless
     option elements are styled directly — without this it renders with the
     OS's default light popup regardless of the page's dark theme. */
  select.project-picker option {
    background: var(--panel);
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: #201400;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s var(--ease), background 0.2s, color 0.2s, border-color 0.2s;
  }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240,180,41,0.35); }
  /* A press should feel physical: a quick give under the finger. */
  button:active { transform: translateY(0) scale(0.97); transition-duration: 0.06s; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    box-shadow: none;
  }
  button.ghost:hover { border-color: var(--accent-dim); color: var(--text); transform: none; box-shadow: none; filter: none; }
  button.ghost:active { transform: scale(0.97); }

  .topics-wrap { margin-bottom: 20px; }
  .topic {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), opacity 0.25s var(--ease);
  }
  .topic:hover { border-color: var(--accent-dim); }
  /* Rated, waiting on the server: acknowledged instantly, settles once the
     new schedule comes back and the row glides to its new place. */
  .topic.is-settling { opacity: 0.55; pointer-events: none; }
  .topic:last-child { margin-bottom: 0; }
  .topic.status-overdue { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger), 0 0 20px rgba(232,98,63,0.28); }
  .topic.status-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(240,180,41,0.28); }
  .topic-title { font-size: 15px; }
  .topic-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .topic-insight { color: var(--text-dim); font-size: 12px; font-style: italic; margin-top: 2px; }
  .topic-retention { font-size: 12px; margin-top: 3px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .retention-pips { display: inline-flex; gap: 3px; }
  .retention-pip { width: 10px; height: 4px; border-radius: 2px; background: var(--border); }
  .retention-pip.done { background: var(--accent-dim); }
  .topic-retention.retained { color: var(--accent); }
  .topic-retention.retained .retention-pip { background: var(--accent); box-shadow: 0 0 6px rgba(240,180,41,0.5); }
  .topic-retention.short .short-note { color: var(--danger); }
  .topic-retention.short .retention-pip.done { background: var(--danger); opacity: 0.7; }
  .topic-unconfirmed { color: var(--danger); opacity: 0.85; }
  .review-history { display: flex; gap: 4px; margin-top: 4px; }
  .review-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .review-dot.q-low { background: var(--danger); }
  .review-dot.q-mid { background: var(--accent-dim); }
  .review-dot.q-high { background: var(--accent); }
  .topic-edit-form { display: flex; flex-direction: column; gap: 6px; animation: rise 0.26s var(--ease); }
  .topic-edit-title {
    background: rgba(0,0,0,0.25); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  .topic-edit-title:focus { outline: none; border-color: var(--accent-dim); }
  .topic-edit-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .topic-edit-actions { display: flex; align-items: center; gap: 6px; }
  .topic-edit-btn {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 12px; cursor: pointer; padding: 8px; line-height: 1;
  }
  .topic-edit-btn:hover { color: var(--accent); }
  .topic-due {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: var(--text-dim);
  }
  .topic-due.due-today { color: var(--accent); font-weight: 600; }
  .topic-due.overdue {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; font-size: 11px;
    border: 1.5px solid var(--danger); color: var(--danger);
    box-shadow: 0 0 10px rgba(232,98,63,0.5);
  }
  .topic-right { display: flex; align-items: center; gap: 10px; }
  .pushed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .archive-btn {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 8px; line-height: 1;
    margin: -8px;
  }
  .archive-btn:hover { color: var(--danger); }
  .archive-confirm-row { display: flex; align-items: center; gap: 6px; }
  .archive-confirm {
    background: var(--danger);
    color: #210a04; border: none; padding: 5px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .archive-cancel {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .archive-cancel:hover { border-color: var(--accent-dim); color: var(--text); }

  /* Expands/collapses instead of snapping: the 0fr -> 1fr grid-row trick
     animates to the content's natural height without hardcoding it.
     visibility (delayed on close) keeps collapsed buttons out of tab order. */
  .quality-row {
    display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: 0; visibility: hidden;
    transition: grid-template-rows 0.28s var(--ease), opacity 0.2s ease, margin-top 0.28s var(--ease), visibility 0s linear 0.28s;
  }
  .quality-row.open {
    grid-template-rows: 1fr; opacity: 1; margin-top: 10px; visibility: visible;
    transition-delay: 0s;
  }
  /* overflow must clip the collapsed row, but not the buttons' hover lift
     and glow - the padding/negative-margin pair gives them room inside it. */
  .qbtns { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; overflow: hidden; padding: 6px; margin: -6px; }
  .qbtn {
    width: 30px; height: 30px; border-radius: 50%; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-dim);
    transition: transform 0.15s, filter 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .q-hint { flex-basis: 100%; color: var(--text-dim); font-size: 12px; margin-bottom: 2px; }
  .qbtn:active { transform: scale(0.88); transition-duration: 0.06s; }
  .qbtn.picked { background: var(--accent); color: #201400; border-color: var(--accent); box-shadow: 0 0 14px rgba(240,180,41,0.55); }
  .qbtn:hover, .qbtn:focus-visible {
    transform: translateY(-2px); background: var(--accent); color: #201400;
    border-color: var(--accent); box-shadow: 0 0 14px rgba(240,180,41,0.55); outline: none;
  }

  .empty { color: var(--text-dim); font-size: 14px; padding: 24px 0; text-align: center; }

  /* Category manager */
  .cat-manager summary {
    cursor: pointer; color: var(--text-dim); font-size: 13px; user-select: none;
  }
  .cat-manager summary:hover { color: var(--text); }
  .cat-manager-body { margin-top: 14px; }
  details[open] > .cat-manager-body, details[open] > .bulk-import-body { animation: rise 0.3s var(--ease); }
  .cat-manager summary { transition: color 0.2s; }
  form.add-category { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { cursor: pointer; }
  .cat-name:hover { color: var(--accent); }
  .cat-edit-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 0; }

  /* Grouped topic list */
  .cat-header {
    color: var(--text-dim); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 14px 0 6px; border-bottom: 1px solid var(--border);
  }
  .cat-header:first-child { padding-top: 0; }
  .cat-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exam-chip {
    background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
    font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0;
    padding: 3px 9px; border-radius: 999px; cursor: pointer;
  }
  .exam-chip:hover { border-color: var(--accent-dim); color: var(--text); filter: none; transform: none; box-shadow: none; }
  .exam-chip.set { border-style: solid; border-color: var(--accent-dim); color: var(--accent); }
  .exam-chip-edit { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; text-transform: none; letter-spacing: 0; font-weight: 500; animation: rise 0.24s var(--ease); }
  .exam-chip-edit input[type="date"] { padding: 5px 8px; font-size: 12px; }
  .exam-chip-edit button { padding: 5px 10px; font-size: 12px; }
  .cat-row-right { display: flex; align-items: center; gap: 12px; }
  .exam-short { color: var(--danger); font-size: 12px; margin-top: 4px; }
  .cat-exam-label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
  .cat-exam-label input[type="date"] { padding: 8px 10px; }

  /* Upcoming exams: a countdown + readiness per course with an exam ahead */
  .panel-heading {
    font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 14px;
  }
  .exam-course { display: flex; gap: 16px; align-items: flex-start; }
  .exam-course + .exam-course { margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.06); }
  .exam-countdown {
    flex: none; width: 64px; text-align: center; padding: 8px 0 6px;
    border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,0.18);
  }
  .exam-days { display: block; font-family: 'Fraunces', serif; font-size: 26px; line-height: 1; color: var(--text); }
  .exam-days-label { display: block; font-size: 10px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  /* Glow is earned: only an exam inside its final-pass window lights up. */
  .exam-countdown.soon { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(240,180,41,0.3); }
  .exam-countdown.soon .exam-days { color: var(--accent); text-shadow: 0 0 12px rgba(240,180,41,0.5); }
  .exam-body { flex: 1; min-width: 0; }
  .exam-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .exam-name { font-weight: 600; }
  .exam-when { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .exam-empty { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .exam-bar {
    height: 6px; border-radius: 999px; margin: 8px 0 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); overflow: hidden;
  }
  .exam-fill { height: 100%; background: var(--accent-dim); border-radius: 999px; }
  .exam-fill.full { background: var(--accent); box-shadow: 0 0 10px rgba(240,180,41,0.6); }
  .exam-stats { color: var(--text); font-size: 13px; }
  .exam-substats { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  /* Exams on the calendar: a striped gold "ticket" day with a star, and a
     small bar under the final-pass days just before it. */
  .cal-day.exam-day {
    background: repeating-linear-gradient(135deg, rgba(240,180,41,0.22) 0 4px, rgba(240,180,41,0.06) 4px 8px);
    border: 1.5px solid var(--accent); color: var(--text); font-weight: 600; cursor: pointer;
    box-shadow: 0 0 12px rgba(240,180,41,0.35);
  }
  .cal-day.exam-day.past { box-shadow: none; opacity: 0.55; }
  .cal-day.exam-day:hover { transform: scale(1.07); }
  .cal-exam-star {
    position: absolute; top: 2px; left: 4px; font-size: 10px; line-height: 1;
    color: var(--accent); text-shadow: 0 0 6px rgba(240,180,41,0.8);
  }
  .cal-day.final-pass::before {
    content: ''; position: absolute; bottom: 4px; left: 28%; right: 28%; height: 2px;
    border-radius: 2px; background: var(--accent); opacity: 0.8;
  }
  .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--text-dim); font-size: 11px; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend-exam { width: 12px; height: 9px; border-radius: 3px; border: 1px solid var(--accent);
    background: repeating-linear-gradient(135deg, rgba(240,180,41,0.4) 0 2px, transparent 2px 4px); }
  .cal-legend-final { width: 12px; height: 2px; border-radius: 2px; background: var(--accent); }
  .cal-detail-exam {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 8px;
    border: 1px solid var(--accent-dim); border-radius: 8px; background: rgba(240,180,41,0.06);
    animation: rise 0.3s var(--ease) both;
  }
  .cal-detail-exam .cal-exam-star { position: static; font-size: 13px; }

  /* Bulk import */
  .bulk-import-body { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .bulk-import textarea {
    width: 100%; min-height: 140px; resize: vertical;
    background: rgba(0,0,0,0.25); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font: inherit; font-size: 14px;
  }
  .bulk-import textarea:focus { outline: none; border-color: var(--accent-dim); }
  .bulk-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bulk-row input[type="number"] {
    width: 64px; background: rgba(0,0,0,0.25); border: 1px solid var(--border);
    color: var(--text); padding: 10px 8px; border-radius: 8px; font-size: 13px;
  }
  .bulk-preview { color: var(--text-dim); font-size: 12px; }
  .bulk-preview.error { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Steady<span class="wordmark-cursor" aria-hidden="true"></span></h1>
    <button type="button" class="push-now-btn" id="signOutBtn">Sign out</button>
  </div>
  <p class="tagline" id="greeting">Log what you studied. Steady tells you when to look at it again.</p>

  <div class="panel heatmap-panel">
    <div class="heatmap" id="heatmap"></div>
    <div class="heatmap-label"><span>28 days ago</span><span>today</span></div>
    <div class="scrawl" id="dailyQuote"></div>
    <div class="sync-status" id="syncStatus">
      <span id="syncStatusText"></span>
      <button type="button" class="push-now-btn" id="pushNowBtn" style="display:none" title="Send everything due today to Todoist right now, instead of waiting for the morning run">Send to Todoist</button>
      <button type="button" class="push-now-btn" id="syncNowBtn" style="display:none" title="Pull in reviews you've ticked off in Todoist">Check Todoist</button>
    </div>
  </div>

  <div class="panel readiness-panel" id="readinessPanel">
    <div class="panel-heading">Upcoming exams</div>
    <div id="readinessList"></div>
  </div>

  <div class="panel cal-panel">
    <div class="cal-header">
      <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">&lsaquo;</button>
      <div class="cal-title" id="calTitle"></div>
      <button type="button" class="cal-nav" id="calNext" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="cal-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend" style="display:none"><span><i class="cal-legend-exam"></i>Exam</span><span><i class="cal-legend-final"></i>Final review days</span></div>
    <div class="cal-detail" id="calDetail" style="display:none"></div>
  </div>

  <div class="panel add-panel">
    <form class="add-topic" id="addForm">
      <input type="text" id="titleInput" placeholder="What did you study today?" required />
      <select class="project-picker" id="categoryPicker"><option value="">Uncategorized</option></select>
      <select class="project-picker" id="projectPicker" style="display:none"></select>
      <button type="button" class="ghost" id="backdateToggle" title="Log a study session from an earlier date">Studied earlier?</button>
      <input type="date" id="studiedOnInput" style="display:none" />
      <button type="submit">Add</button>
    </form>
  </div>

  <details class="panel cat-manager bulk-import">
    <summary>Add a backlog of older topics</summary>
    <form class="bulk-import-body" id="bulkForm">
      <textarea id="bulkTitles" placeholder="One topic per line — paste in your old list and Steady will spread them out"></textarea>
      <div class="bulk-row">
        <select class="project-picker" id="bulkCategoryPicker"><option value="">Uncategorized</option></select>
        <select class="project-picker" id="bulkProjectPicker" style="display:none"></select>
        <label class="cat-exam-label">Per day <input type="number" id="bulkPerDay" min="1" max="100" value="5" /></label>
        <button type="submit" class="ghost" id="bulkSubmit">Import</button>
      </div>
      <div class="bulk-preview" id="bulkPreview"></div>
    </form>
  </details>

  <details class="panel cat-manager">
    <summary>Courses &amp; categories</summary>
    <div class="cat-manager-body">
      <form class="add-category" id="addCategoryForm">
        <input type="text" id="categoryNameInput" placeholder="New category name" required />
        <select class="project-picker" id="categoryParentPicker"><option value="">Top level</option></select>
        <select class="project-picker" id="categoryTodoistPicker" style="display:none"></select>
        <button type="submit" class="ghost">Add category</button>
      </form>
      <div id="categoryManagerList"></div>
    </div>
  </details>

  <div class="topics-wrap">
    <div id="topicList"></div>
  </div>
</div>

<div class="undo-toast" id="undoToast" style="display:none"></div>

<div class="time-prompt" id="timePrompt" style="display:none">
  <span>How long did that take?</span>
  <input type="number" id="timeHours" min="0" placeholder="hrs" />
  <input type="number" id="timeMins" min="0" max="59" placeholder="mins" />
  <button type="button" id="timeLogBtn">Save</button>
  <button type="button" id="timeSkipBtn" class="ghost">Skip</button>
</div>

<script>
  // Same-origin API served by the Worker. Falls back to localStorage if
  // the API isn't reachable (e.g. opening this file directly, no backend yet).
  const API = '/api';
  let useLocal = false;
  let localTopics = JSON.parse(localStorage.getItem('steady_topics') || '[]');
  let localCategories = JSON.parse(localStorage.getItem('steady_categories') || '[]');
  let projectsById = {};

  function saveLocal() {
    localStorage.setItem('steady_topics', JSON.stringify(localTopics));
  }

  function saveLocalCategories() {
    localStorage.setItem('steady_categories', JSON.stringify(localCategories));
  }

  // Local-mode counterpart of the server's reclampAllTopics(): pulls in any
  // topic scheduled past its course's exam cap, after anything that can
  // change that cap without a review happening.
  function reclampLocalTopics() {
    const categoryMap = Object.fromEntries(localCategories.map((c) => [c.id, c]));
    const today = todayISO();
    for (const t of localTopics) {
      if (t.archived || !t.category_id) continue;
      const cap = examCapDate(examDatesFor(categoryMap, t.category_id), t.last_reviewed, today);
      if (cap && t.next_due > cap) t.next_due = cap;
    }
    saveLocal();
  }

  // Single-user app, user is on IST (UTC+5:30, no DST) — see CLAUDE.md.
  // Anchoring on IST instead of raw UTC matters: without it, the app thinks
  // it's still yesterday until 5:30am local time.
  const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
  function nowIST() {
    return new Date(Date.now() + IST_OFFSET_MS);
  }
  function todayISO() {
    return nowIST().toISOString().slice(0, 10);
  }
  function shiftISO(iso, days) {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function daysBetween(fromISO, toISO) {
    return Math.round((Date.parse(toISO) - Date.parse(fromISO)) / 86400000);
  }
  // "Oct 27–28", or "Oct 31 – Nov 1" across a month boundary.
  function formatDateRange(fromISO, toISO) {
    if (fromISO.slice(0, 7) === toISO.slice(0, 7)) return `${formatShortDate(fromISO)}–${Number(toISO.slice(8))}`;
    return `${formatShortDate(fromISO)} – ${formatShortDate(toISO)}`;
  }
  function formatShortDate(iso) {
    return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  // Exam-date cap — mirrors examDatesFor()/examCapDate() in worker/index.js
  // exactly (see CLAUDE.md). Used here for local mode's own scheduling, the
  // bulk-import preview, and re-clamping local topics.
  function examDatesFor(categoryMap, categoryId) {
    const dates = [];
    const seen = new Set();
    let cur = categoryId;
    while (cur && !seen.has(cur) && categoryMap[cur]) {
      seen.add(cur);
      if (categoryMap[cur].exam_date) dates.push(categoryMap[cur].exam_date);
      cur = categoryMap[cur].parent_id;
    }
    return dates;
  }
  function examCapDate(examDates, lastReviewed, today) {
    let cap = null;
    for (const exam of examDates) {
      if (exam < today) continue;
      if (lastReviewed && lastReviewed >= shiftISO(exam, -3)) continue;
      const finalPass = shiftISO(exam, -2);
      const limit = finalPass > today ? finalPass : today;
      if (cap === null || limit < cap) cap = limit;
    }
    return cap;
  }

  // "+4d" / "−3d" — both nextDue and today are date-only ISO strings, which
  // every JS engine parses as UTC midnight per spec, so this diff is exact
  // regardless of the IST offset used to compute `today` upstream.
  function dueDelta(nextDue, today) {
    const days = Math.round((Date.parse(nextDue) - Date.parse(today)) / 86400000);
    return days > 0 ? `+${days}d` : `−${Math.abs(days)}d`;
  }

  // Rotating line about the nature of revision itself — never addressed at
  // the user directly, never "don't break it" framing. Picked deterministically
  // from today's date so it's stable all day and changes tomorrow, not on
  // every reload.
  const REVISION_QUOTES = [
    "What resurfaces was never really gone.",
    "Recall is a muscle; forgetting is just its untrained state.",
    "Every review is a small vote for what a mind keeps.",
    "Memory rewards the return, not the first visit.",
    "The interval is the point — not the cramming, the coming back.",
    "Nothing sticks on the first pass. That's the method, not a failure.",
    "Spaced repetition works because forgetting is scheduled too.",
    "A fact revisited late is worth more than one revisited early.",
    "The gap between reviews does as much work as the review itself.",
    "Understanding fades on a curve; revision resets the curve, not the clock.",
    "Retrieval, not re-reading, carries a fact forward.",
    "Today's review is yesterday's memory, tested.",
    "The point of returning isn't repetition — it's proof.",
    "Forgetting has a schedule. So does coming back.",
    "A memory tested is a memory kept.",
    "The struggle to recall is where the strengthening happens.",
    "Easy review, weak trace. Hard review, deep root.",
    "What's due today was decided by how it went last time.",
    "Consistency compounds; a single long session doesn't.",
    "The curve doesn't care about good intentions, only intervals.",
    "Reviewing on time is cheaper than relearning from scratch.",
    "Each pass makes the next gap wider — that's the whole design.",
    "A skipped review doesn't vanish. It just gets harder.",
    "What's rehearsed under difficulty is what survives.",
    "The schedule remembers what the mind hasn't yet.",
    "Knowledge decays quietly until it's asked a question.",
    "Small, spaced effort outlasts one large one.",
    "The value of a review is set before it starts, by the wait.",
    "Recognition is cheap. Recall is what counts.",
    "A streak isn't the goal — the retention under it is.",
  ];
  // What each 0-5 rating means, in words - shown as button tooltips and the
  // quality row's hint, so the scale doesn't have to be memorised.
  const QUALITY_LABELS = [
    '0 — blank, nothing came back',
    '1 — barely, mostly forgotten',
    '2 — hazy, got bits of it',
    '3 — got there, with real effort',
    '4 — solid, a little hesitation',
    '5 — effortless',
  ];

  function dailyQuote() {
    const seed = todayISO();
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) | 0;
    return REVISION_QUOTES[Math.abs(hash) % REVISION_QUOTES.length];
  }

  function sm2(prev, quality, elapsedDays) {
    let { ef, interval_days, repetitions } = prev;
    if (quality < 3) {
      repetitions = 0;
      interval_days = 1;
    } else {
      repetitions += 1;
      if (repetitions === 1) interval_days = 1;
      else if (repetitions === 2) interval_days = 6;
      else {
        // Mirrors worker/index.js's sm2() exactly — see CLAUDE.md for the
        // SM-4-sourced derivation of this elapsed-time correction.
        const naive = interval_days * ef;
        const oiPrime = elapsedDays + (elapsedDays * (1 - 1 / ef)) / 2 * (0.25 * quality - 1);
        const FRACTION = 0.3;
        const blended = (1 - FRACTION) * naive + FRACTION * oiPrime;
        interval_days = Math.max(interval_days, Math.round(blended));
      }
    }
    ef = ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    if (ef < 1.3) ef = 1.3;
    const next = nowIST();
    next.setUTCDate(next.getUTCDate() + interval_days);
    return { ef, interval_days, repetitions, next_due: next.toISOString().slice(0, 10) };
  }

  // A 401 means the session cookie expired or was cleared, not that the API
  // is unreachable - send the browser to sign in rather than letting the
  // caller fall back to localStorage mode and silently diverge from the
  // server.
  function redirectIfSignedOut(res) {
    if (res.status !== 401) return false;
    const here = location.pathname + location.search;
    location.href = '/login' + (here !== '/' ? `?next=${encodeURIComponent(here)}` : '');
    return true;
  }

  async function signOut() {
    try { await fetch(API + '/logout', { method: 'POST' }); } catch (e) { /* cookie clears on expiry anyway */ }
    location.href = '/login';
  }

  async function apiFetch(path, opts) {
    let res;
    try {
      res = await fetch(API + path, opts);
    } catch (e) {
      useLocal = true;
      throw e;
    }
    if (redirectIfSignedOut(res)) throw new Error('signed out');
    try {
      if (!res.ok) throw new Error('api error');
      return await res.json();
    } catch (e) {
      useLocal = true;
      throw e;
    }
  }

  /**
   * Like apiFetch, but for writes that have real validation the user can
   * trigger (e.g. the category cycle guard) — apiFetch treats every non-OK
   * response as "API unreachable, fall back to localStorage," which would
   * silently discard a legitimate rejection and duplicate the write locally.
   * This distinguishes "unreachable" (falls back) from "reachable but
   * rejected" (surfaces the real error, does NOT fall back).
   */
  async function apiPost(path, method, body) {
    try {
      const res = await fetch(API + path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      if (redirectIfSignedOut(res)) return { ok: false, error: 'signed out' };
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status >= 500) useLocal = true;
        return { ok: false, error: data.error || 'request failed' };
      }
      return { ok: true, data };
    } catch (e) {
      useLocal = true;
      return { ok: false, error: 'network error', networkFailure: true };
    }
  }

  async function loadTopics() {
    if (!useLocal) {
      try { return await apiFetch('/topics'); } catch (e) { /* fall through */ }
    }
    return localTopics
      .filter((t) => !t.archived)
      .sort((a, b) => a.next_due.localeCompare(b.next_due));
  }

  async function loadStats() {
    if (!useLocal) {
      try { return await apiFetch('/stats'); } catch (e) { /* fall through */ }
    }
    const days = [];
    const reviewDates = localTopics.flatMap((t) => t.reviewLog || []);
    for (let i = 27; i >= 0; i--) {
      const d = nowIST();
      d.setUTCDate(d.getUTCDate() - i);
      const key = d.toISOString().slice(0, 10);
      days.push({ day: key, count: reviewDates.filter((r) => r === key).length });
    }
    return days;
  }

  let calMonth = todayISO().slice(0, 7);
  let calDays = {};
  let selectedCalDay = null;

  async function loadCalendar(month) {
    if (!useLocal) {
      try { return await apiFetch(`/calendar?month=${month}`); } catch (e) { /* fall through */ }
    }
    const days = {};
    for (const t of localTopics) {
      if (t.archived) continue;
      if (t.next_due && t.next_due.startsWith(month)) {
        (days[t.next_due] ||= []).push({ id: t.id, title: t.title });
      }
    }
    return { month, days };
  }

  function shiftMonth(month, delta) {
    const [y, m] = month.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 1 + delta, 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
  }

  // Every exam_date across all categories, keyed by date, plus the final-pass
  // window (exam-3 .. exam-2, the days the exam cap aims a topic's last
  // review at) for exams still ahead.
  function examCalendarIndex() {
    const today = todayISO();
    const exams = {};
    const finalPass = {};
    for (const c of lastCategories) {
      if (!c.exam_date) continue;
      (exams[c.exam_date] ||= []).push(c);
      if (c.exam_date >= today) {
        for (const off of [-3, -2]) (finalPass[shiftISO(c.exam_date, off)] ||= []).push(c);
      }
    }
    return { exams, finalPass };
  }

  function renderCalendar({ month, days }) {
    const [y, m] = month.split('-').map(Number);
    document.getElementById('calTitle').textContent =
      new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });

    const firstWeekday = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const today = todayISO();
    const { exams, finalPass } = examCalendarIndex();
    let monthHasExamMarks = false;

    let html = '';
    for (let i = 0; i < firstWeekday; i++) html += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${month}-${String(d).padStart(2, '0')}`;
      const due = days[dateStr] || [];
      const count = due.length;
      const isToday = dateStr === today;
      const isOverdue = dateStr < today && count > 0;
      const tier = count === 0 ? 0 : count <= 1 ? 1 : count <= 3 ? 2 : 3;
      const classes = ['cal-day'];
      if (isToday) classes.push('today');
      if (tier > 0) classes.push(isOverdue ? `overdue-${tier}` : `due-${tier}`, 'has-due');
      const examsHere = exams[dateStr] || [];
      const finalHere = finalPass[dateStr] || [];
      if (examsHere.length) classes.push('exam-day', ...(dateStr < today ? ['past'] : []));
      else if (finalHere.length) classes.push('final-pass');
      if (examsHere.length || finalHere.length) monthHasExamMarks = true;
      if (dateStr === selectedCalDay) classes.push('selected');
      const badge = count > 3 ? `<div class="cal-badge">${count}</div>` : '';
      const star = examsHere.length ? '<span class="cal-exam-star" aria-hidden="true">★</span>' : '';
      const tips = [
        ...examsHere.map((c) => `${c.name} exam`),
        ...finalHere.map((c) => `Final review day for ${c.name}`),
        ...due.map((t) => t.title),
      ];
      const titleAttr = tips.length ? ` title="${escapeHtml(tips.join('\n'))}"` : '';
      const dateAttr = due.length || examsHere.length ? ` data-date="${dateStr}"` : '';
      html += `<div class="${classes.join(' ')}"${titleAttr}${dateAttr}>${star}<span>${d}</span>${badge}</div>`;
    }
    patchChildren(document.getElementById('calGrid'), html);
    document.getElementById('calLegend').style.display = monthHasExamMarks ? '' : 'none';
  }

  function renderCalDetail() {
    const detail = document.getElementById('calDetail');
    const due = selectedCalDay ? (calDays[selectedCalDay] || []) : [];
    const examsHere = selectedCalDay ? (examCalendarIndex().exams[selectedCalDay] || []) : [];
    if (!selectedCalDay || (!due.length && !examsHere.length)) {
      detail.style.display = 'none';
      detail.innerHTML = '';
      return;
    }
    const today = todayISO();
    const actionable = selectedCalDay <= today; // today or overdue: can review right here
    const dayName = new Date(selectedCalDay + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' });
    const examHtml = examsHere.map((c) => {
      const left = daysBetween(today, c.exam_date);
      const when = left < 0 ? 'already done' : left === 0 ? 'today — good luck' : left === 1 ? 'tomorrow' : `in ${left} days`;
      return `<div class="cal-detail-exam"><span class="cal-exam-star" aria-hidden="true">★</span><span><strong>${escapeHtml(c.name)}</strong> exam · ${when}</span></div>`;
    }).join('');
    const heading = !due.length
      ? dayName
      : selectedCalDay < today
        ? `${dayName} — ${due.length} still waiting from this day`
        : selectedCalDay === today
          ? `Today — ${due.length} to review`
          : `${dayName} — ${due.length} coming up`;
    detail.style.display = '';
    detail.innerHTML = `
      <div class="cal-detail-title">${heading}</div>
      ${examHtml}
      ${due.map((t, i) => `
        <div class="cal-detail-topic" data-detail-id="${t.id}" style="animation-delay:${Math.min(i * 30, 240)}ms">
          <span>${escapeHtml(t.title)}</span>
          ${actionable
            ? `<div class="cal-detail-quality">${[0, 1, 2, 3, 4, 5].map((q) => `<button type="button" class="qbtn" data-q="${q}" data-id="${t.id}" data-detail-review="1" title="${QUALITY_LABELS[q]}">${q}</button>`).join('')}</div>`
            : ''}
        </div>`).join('')}
    `;
  }

  function renderSyncStatus(status) {
    const textEl = document.getElementById('syncStatusText');
    const push = status && status.push;
    if (!push) {
      textEl.innerHTML = '';
    } else {
      const warn = !push.ok || push.stale || push.failed > 0;
      const timeAgo = (() => {
        const ms = Date.now() - Date.parse(push.run_at.replace(' ', 'T') + 'Z');
        const hours = Math.round(ms / 3600000);
        if (hours < 1) return 'just now';
        if (hours < 24) return `${hours}h ago`;
        return `${Math.round(hours / 24)}d ago`;
      })();
      const sent = `${push.succeeded} review${push.succeeded === 1 ? '' : 's'}`;
      const label = !push.ok
        ? `Couldn't reach Todoist (${timeAgo})`
        : push.failed
          ? `Sent ${sent} to Todoist ${timeAgo} · ${push.failed} didn't go through`
          : `Sent ${sent} to Todoist ${timeAgo}`;
      textEl.innerHTML = `<span style="${warn ? 'color:var(--danger)' : ''}">${escapeHtml(label)}</span>`;
    }
    // No real backend to push to in local/offline mode, or if the
    // sync-status fetch itself couldn't reach the API (status is null).
    const hidden = useLocal || !status;
    document.getElementById('pushNowBtn').style.display = hidden ? 'none' : '';
    document.getElementById('syncNowBtn').style.display = hidden ? 'none' : '';

  // --- Bulk backlog import ------------------------------------------------

  /**
   * First-review dates for a backlog of `count` topics: `perDay` at a time
   * starting today, in the order given. If that would run past `cap` (the
   * course's exam cap), the same topics are instead spread evenly across
   * every day up to the cap, so nothing's first review lands after its exam's
   * final-pass window. The server re-applies the cap on its side too.
   */
  function staggerDueDates(count, perDay, today, cap) {
    const daysNeeded = Math.ceil(count / perDay);
    const daysAvailable = cap ? daysBetween(today, cap) + 1 : Infinity;
    const compressed = daysNeeded > daysAvailable;
    const dates = [];
    for (let i = 0; i < count; i++) {
      const day = compressed ? Math.floor((i * daysAvailable) / count) : Math.floor(i / perDay);
      dates.push(shiftISO(today, day));
    }
    return { dates, compressed };
  }

  function bulkCapFor(categoryId) {
    if (!categoryId) return null;
    const categoryMap = Object.fromEntries(lastCategories.map((c) => [c.id, c]));
    return examCapDate(examDatesFor(categoryMap, Number(categoryId)), null, todayISO());
  }

  function bulkPlan() {
    const titles = document.getElementById('bulkTitles').value
      .split('\n').map((l) => l.trim()).filter(Boolean);
    const perDay = Math.max(1, Math.min(100, Number(document.getElementById('bulkPerDay').value) || 5));
    const categoryId = document.getElementById('bulkCategoryPicker').value;
    const cap = bulkCapFor(categoryId);
    const { dates, compressed } = staggerDueDates(titles.length, perDay, todayISO(), cap);
    return { titles, dates, compressed, cap, categoryId };
  }

  function renderBulkPreview(message, isError) {
    const preview = document.getElementById('bulkPreview');
    preview.classList.toggle('error', !!isError);
    if (message !== undefined) { preview.textContent = message; return; }
    const { titles, dates, compressed, cap } = bulkPlan();
    if (!titles.length) { preview.textContent = ''; return; }
    const first = dates[0], last = dates[dates.length - 1];
    const days = daysBetween(first, last) + 1;
    const range = first === last ? formatShortDate(first) : `${formatShortDate(first)} → ${formatShortDate(last)}`;
    preview.textContent =
      `${titles.length} topic${titles.length === 1 ? '' : 's'}, first reviews spread over ${days} day${days === 1 ? '' : 's'} (${range})` +
      (compressed ? ` — squeezed in so they all start before the exam` : '');
  }

  async function bulkImport(items, categoryId, todoistProjectId) {

      });
      if (result.ok) return { ok: true, created: result.data.created };

    }

  // --- Exam readiness -----------------------------------------------------

  /**
   * One row per category with its own upcoming exam_date, covering every
   * topic in its subtree. "Ready" = latest rating 4+ AND another review
   * scheduled before the exam day — the two things asked for, shown both
   * separately and combined. Hidden entirely until some course has an
   * upcoming exam, same "invisible until earned" rule as everywhere else.
   */
  // --- Retention estimate ---------------------------------------------------
  //
  // "Retained" = last rated 4+ AND the gap to the next review has grown to
  // 3+ weeks (the bar the user picked; also the conventional "mature card"
  // threshold in spaced repetition). For anything short of that, the work
  // left is estimated by running Steady's own sm2() forward from the topic's
  // current state, assuming each review happens on time and goes well
  // (rated 4), and counting reviews until the interval reaches 3 weeks. It's
  // a projection, not a promise: a lower rating resets or slows it, which
  // the next render simply reflects. Computed client-side from fields every
  // topic already carries, so it works offline too and adds no
  // server/client hand-synced pair (it reuses the existing sm2() copy).
  const RETAINED_INTERVAL_DAYS = 21;

  function retentionEstimate(t, today) {
    if (t.last_quality != null && t.last_quality >= 4 && t.interval_days >= RETAINED_INTERVAL_DAYS) {
      return { retained: true };
    }
    let state = { ef: t.ef, interval_days: t.interval_days, repetitions: t.repetitions };
    let reviewDate = t.next_due > today ? t.next_due : today;
    let reviews = 0;
    for (;;) {
      state = sm2(state, 4, state.interval_days); // on time: elapsed == scheduled interval
      reviews++;
      if (state.interval_days >= RETAINED_INTERVAL_DAYS || reviews >= 30) break;
      reviewDate = shiftISO(reviewDate, state.interval_days);
    }
    // reviewDate is when the review that crosses the bar happens.
    return { retained: false, reviews, reachDate: reviewDate, path: t.repetitions };
  }

  // The soonest exam still ahead for a topic, across its category chain.
  function upcomingExamFor(t, today) {
    if (!t.category_id) return null;
    const categoryMap = Object.fromEntries(lastCategories.map((c) => [c.id, c]));
    const upcoming = examDatesFor(categoryMap, t.category_id).filter((d) => d >= today).sort();
    return upcoming[0] || null;
  }

  function renderRetention(t, today) {
    const est = retentionEstimate(t, today);
    // Progress pips: how far along the path to retained this topic is,
    // measured in reviews (done = reviews already behind it on this streak).
    const done = Math.min(t.repetitions, 6);
    const total = est.retained ? done || 1 : Math.min(done + est.reviews, 8);
    const pips = `<span class="retention-pips" aria-hidden="true">${Array.from({ length: total }, (_, i) =>
      `<span class="retention-pip ${i < done ? 'done' : ''}"></span>`).join('')}</span>`;
    if (est.retained) {
      return `<div class="topic-retention retained" title="Rated 4+ and 3+ weeks between reviews">${pips}This one's stuck</div>`;
    }
    const n = `About ${est.reviews} more good review${est.reviews === 1 ? '' : 's'} until this sticks`;
    const why = `title="Assuming on-time reviews you'd rate 4, this reaches 3+ weeks between reviews around ${formatShortDate(est.reachDate)}"`;
    const exam = upcomingExamFor(t, today);
    if (exam && est.reachDate > exam) {
      return `<div class="topic-retention short" ${why}>${pips}<span>${n} — <span class="short-note">more than fits before the ${formatShortDate(exam)} exam</span></span></div>`;
    }
    return `<div class="topic-retention" ${why}>${pips}${n} (around ${formatShortDate(est.reachDate)})</div>`;
  }

  // Exam date chip: shown on each category header in the topic list and in
  // the category manager, so a course's exam date is settable right where
  // its topics are, not only inside the category edit row.
  let editingExamCategoryId = null;
  function examChipHtml(category) {
    if (editingExamCategoryId === category.id) {
      return `<span class="exam-chip-edit" data-exam-edit="${category.id}">
          <input type="date" class="exam-chip-input" value="${category.exam_date || ''}" min="${todayISO()}" aria-label="Exam date" />
          <button type="button" data-save-exam="${category.id}">Save</button>
          ${category.exam_date ? `<button type="button" class="ghost" data-clear-exam="${category.id}">Clear</button>` : ''}
          <button type="button" class="ghost" data-cancel-exam="${category.id}">Cancel</button>
        </span>`;
    }
    if (category.exam_date) {
      const past = category.exam_date < todayISO();
      return `<button type="button" class="exam-chip ${past ? '' : 'set'}" data-set-exam="${category.id}" title="Change exam date">Exam ${formatShortDate(category.exam_date)}${past ? ' (past)' : ''}</button>`;
    }
    return `<button type="button" class="exam-chip" data-set-exam="${category.id}">Set exam date</button>`;
  }

  /**
   * "Upcoming exams": one card per category with an exam still ahead,
   * covering every topic in its subtree - a countdown, plus readiness:
   * "ready" = last rated 4+ AND another review lined up before exam day
   * (both asked for, shown together and separately), how many have fully
   * stuck (retentionEstimate), and which won't stick in time. Always shown,
   * with an empty state that says how to add one - the section doubles as
   * the pointer to the exam-date feature itself.
   */
  function renderReadiness(topics, categories) {
    const today = todayISO();
    const listEl = document.getElementById('readinessList');
    const { order } = buildCategoryTree(categories);
    const courses = order
      .filter(({ category }) => category.exam_date && category.exam_date >= today)
      .sort((a, b) => a.category.exam_date.localeCompare(b.category.exam_date));
    if (!courses.length) {
      patchChildren(listEl, `<div class="exam-empty">${categories.length
        ? 'No exams coming up. Give a course its exam date with <strong>Set exam date</strong> next to its name, and Steady will line your reviews up for it.'
        : 'No exams coming up. Make a category for each course under <strong>Courses &amp; categories</strong>, then give it an exam date — Steady will line your reviews up for it.'}</div>`);
      return;
    }

    const childrenOf = {};
    for (const c of categories) (childrenOf[c.parent_id ?? 'root'] ||= []).push(c.id);
    const subtree = (rootId) => {
      const ids = new Set();
      const stack = [rootId];
      while (stack.length) {
        const id = stack.pop();
        if (ids.has(id)) continue;
        ids.add(id);
        stack.push(...(childrenOf[id] || []));
      }
      return ids;
    };

    const prevWidths = new Map([...listEl.querySelectorAll('.exam-fill')].map((el) => [el.dataset.course, el.style.width]));
    flipPatch(listEl, courses.map(({ category }) => {
      const ids = subtree(category.id);
      const exam = category.exam_date;
      const ts = topics.filter((t) => ids.has(t.category_id));
      const rated = ts.filter((t) => t.last_quality != null && t.last_quality >= 4);
      const dueBefore = ts.filter((t) => t.next_due < exam);
      const ready = rated.filter((t) => t.next_due < exam);
      const daysLeft = daysBetween(today, exam);
      const inFinalStretch = daysLeft <= 3;
      const pct = ts.length ? Math.round((ready.length / ts.length) * 100) : 0;
      const estimates = ts.map((t) => ({ t, est: retentionEstimate(t, today) }));
      const stuck = estimates.filter(({ est }) => est.retained).length;
      const short = estimates.filter(({ est }) => !est.retained && est.reachDate > exam);
      const examDay = new Date(exam + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
      const finalWindow = daysLeft > 3
        ? ` · final review days ${formatDateRange(shiftISO(exam, -3), shiftISO(exam, -2))}`
        : daysLeft >= 2 ? ' · final review days are now' : '';
      let stats, substats = '';
      if (!ts.length) {
        stats = 'No topics in this course yet.';
      } else {
        stats = ready.length === ts.length
          ? `All ${ts.length} topics are ready.`
          : `${ready.length} of ${ts.length} topics ready — rated 4+ and lined up for another look before the day.`;
        substats = `${rated.length} rated 4 or higher · ${dueBefore.length} coming up again before the exam · ${stuck} stuck for good`;
      }
      const shortNames = short.slice(0, 4).map(({ t }) => escapeHtml(t.title)).join(', ');
      const shortHtml = short.length
        ? `<div class="exam-short">Won't fully stick by exam day: ${shortNames}${short.length > 4 ? ` and ${short.length - 4} more` : ''}</div>`
        : '';
      const countdown = daysLeft === 0
        ? '<span class="exam-days">!</span><span class="exam-days-label">today</span>'
        : `<span class="exam-days">${daysLeft}</span><span class="exam-days-label">day${daysLeft === 1 ? '' : 's'}</span>`;
      return `
        <div class="exam-course" data-flip="x${category.id}">
          <div class="exam-countdown ${inFinalStretch ? 'soon' : ''}">${countdown}</div>
          <div class="exam-body">
            <div class="exam-head">
              <span class="exam-name">${escapeHtml(category.name)}</span>
              ${examChipHtml(category)}
            </div>
            <div class="exam-when">${examDay}${finalWindow}</div>
            <div class="exam-bar"><div class="exam-fill ${ts.length && pct === 100 ? 'full' : ''}" data-course="${category.id}" style="width:${pct}%"></div></div>
            <div class="exam-stats">${stats}</div>
            ${substats ? `<div class="exam-substats">${substats}</div>` : ''}
            ${shortHtml}
          </div>
        </div>`;
    }).join(''));
    if (!MOTION) return;
    for (const el of listEl.querySelectorAll('.exam-fill')) {
      const from = prevWidths.get(el.dataset.course) ?? '0%';
      if (from !== el.style.width) el.animate([{ width: from }, { width: el.style.width }], { duration: 700, easing: EASE });
    }
  }

  // --- Categories ---------------------------------------------------------

  async function loadCategories() {
    if (!useLocal) {
      try { return await apiFetch('/categories'); } catch (e) { /* fall through */ }
    }
    return localCategories.filter((c) => !c.archived);
  }

  /**
   * Pure helper: given a flat category list, returns a byId map and a
   * pre-order traversal (root-first, children immediately after their
   * parent) with each entry tagged with its depth. Reused by both the
   * picker population and the grouped topic-list renderer, so the tree
   * walk exists exactly once.
   */
  function buildCategoryTree(categories) {
    const byId = Object.fromEntries(categories.map((c) => [c.id, c]));
    const childrenOf = {};
    for (const c of categories) {
      const key = c.parent_id ?? 'root';
      (childrenOf[key] ||= []).push(c);
    }
    const order = [];
    (function walk(parentKey, depth) {
      for (const c of childrenOf[parentKey] || []) {
        order.push({ id: c.id, category: c, depth });
        walk(c.id, depth + 1);
      }
    })('root', 0);
    return { byId, order };
  }

  /**
   * Same shape as projectOptionsHtml, but for Steady's own category tree —
   * inline `selected` attribute (not a post-hoc `.value =` like
   * renderCategoryPickers uses), for building select markup as a raw HTML
   * string inside a larger template.
   */
  function categoryOptionsHtml(categories, selectedId) {
    const { order } = buildCategoryTree(categories);
    return order
      .map(({ category, depth }) => `<option value="${category.id}" ${String(category.id) === String(selectedId ?? '') ? 'selected' : ''}>${'  '.repeat(depth)}${escapeHtml(category.name)}</option>`)
      .join('');
  }

  /**
   * Same shape as buildCategoryTree, for Todoist's own project/sub-project
   * tree (parent_id comes straight from Todoist's API). Reused by every
   * picker that lists Todoist projects, so subprojects always render
   * indented under their parent instead of in flat API order.
   */
  function buildProjectTree(projects) {
    const byId = Object.fromEntries(projects.map((p) => [p.id, p]));
    const childrenOf = {};
    for (const p of projects) {
      const key = p.parent_id ?? 'root';
      (childrenOf[key] ||= []).push(p);
    }
    const order = [];
    (function walk(parentKey, depth) {
      for (const p of childrenOf[parentKey] || []) {
        order.push({ id: p.id, project: p, depth });
        walk(p.id, depth + 1);
      }
    })('root', 0);
    return { byId, order };
  }

  function projectOptionsHtml(projects, selectedId) {
    const { order } = buildProjectTree(projects);
    return order
      .map(({ project, depth }) => `<option value="${project.id}" ${String(project.id) === String(selectedId ?? '') ? 'selected' : ''}>${'  '.repeat(depth)}${escapeHtml(project.name)}</option>`)
      .join('');
  }

      if (result.ok) return result.data;

    }
    const category = {

      todoist_project_id: todoistProjectId || null, archived: 0,
